# Northstar V3 - Regime Configuration
# Version: v2_tight_boundaries

version: "v2_tight_boundaries"
description: "Tight regime boundaries. R7 + R8 should cover <= 4 of 20 windows in the current walk-forward setup."

validation:
  max_r7_r8_windows: 5
  warn_if_r7_r8_exceeds: 4

regime_boundaries:
  R7_rate_event:
    label: "R7|Rate-Event"
    event_type: "point_event_window"
    window_weeks_before: 1
    window_weeks_after: 2
    event_dates:
      - "2022-05-04"
      - "2022-06-08"
      - "2022-08-05"
      - "2022-09-30"
      - "2022-12-07"
      - "2023-02-08"
      - "2023-04-06"
      - "2023-06-08"
      - "2023-08-10"
      - "2023-10-06"
      - "2023-12-08"
      - "2024-02-08"
      - "2024-04-05"
      - "2024-06-07"
      - "2024-08-08"
      - "2024-10-09"
      - "2024-12-06"
      - "2025-02-07"
      - "2025-04-09"
      - "2025-06-06"

  R8_election_binary:
    label: "R8|Election/Binary"
    event_type: "point_event_window"
    window_weeks_before: 1
    window_weeks_after: 3
    event_dates:
      - "2019-05-23"
      - "2024-06-04"

exposure_caps:
  "R7|Rate-Event": 0.05
  "R8|Election/Binary": 0.05
  "R4|High-Vol Bear": 0.15
  "R9|External Shock": 0.25
  "default": 0.40

priority_order:
