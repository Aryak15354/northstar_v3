# Options Trading System Configuration
# Integrates with Northstar v3 for institutional-grade options trading

capital:
  base_capital: 500000  # ₹5,00,000
  base_risk_pct: 1.0    # 1% per trade
  max_risk_pct: 1.5     # Hard ceiling
  min_risk_pct: 0.5     # Floor during drawdown

upstox:
  # Credentials loaded from environment variables
  api_key: ${UPSTOX_API_KEY}
  api_secret: ${UPSTOX_API_SECRET}
  access_token: ${UPSTOX_ACCESS_TOKEN}
  
  # API configuration
  rate_limit_per_second: 1
  max_instruments_per_request: 50  # For option greeks API
  
  # Endpoints
  endpoints:
    option_chain: "https://api.upstox.com/v2/option/chain"
    option_contracts: "https://api.upstox.com/v2/option/contract"
    option_greeks: "https://api.upstox.com/v3/market-quote/option-greek"
    market_quote: "https://api.upstox.com/v2/market-quote/quotes"
    token_refresh: "https://api.upstox.com/v2/login/authorization/token"

strategies:
  allowed:
    - iron_condor
    - calendar_spread
    - long_straddle
  
  iron_condor:
    short_delta_range: [0.16, 0.20]  # 16-20 delta for short strikes
    long_delta_range: [0.05, 0.10]   # 5-10 delta for protection
    width_nifty: [100, 200]           # Strike width in points
    width_banknifty: [200, 400]
    min_credit_ratio: 0.25            # Credit ≥ 25% of max loss
    expiry_days: [15, 30]             # Days to expiry range
  
  calendar_spread:
    near_term_days: [7, 14]           # Near-term expiry
    far_term_days: [30, 45]           # Far-term expiry
    strike_selection: "ATM"           # At-the-money
  
  long_straddle:
    strike_selection: "ATM"
    expiry_days: [30, 60]

regime_detection:
  iv_rank_lookback_days: 252          # 1 year of IV history
  vol_of_vol_threshold: 1.5           # std(iv_5d) / std(iv_20d)
  regime_persistence_days: 2          # Min days before trading
  
  thresholds:
    low_vol_sell_iv_rank: 0.70        # 70th percentile
    high_vol_sell_iv_rank: 0.80       # 80th percentile
    rising_vol_buy_iv_rank: 0.30      # 30th percentile

eligibility:
  max_bid_ask_spread_pct: 0.08        # 8% of mid premium
  min_liquidity_depth_multiplier: 1.0 # require at least 1x displayed depth for execution side
  min_days_to_expiry: 5               # No trades < 5 days
  event_buffer_days: 2                # Block short-vol 2 days before events
  late_cycle_days: 10                 # LOW_VOL_SELL duration threshold
  late_cycle_size_reduction: 0.5      # 50% size reduction

capital_scaling:
  profit_milestone_pct: 0.08          # 8% net profit milestone
  profit_scaling_increment: 0.0025    # +0.25% risk per milestone
  drawdown_threshold_1: 0.03          # 3% drawdown
  drawdown_threshold_2: 0.05          # 5% drawdown
  drawdown_descaling_1: 0.0025        # -0.25% risk
  drawdown_descaling_2: 0.005         # -0.50% risk
  min_weeks_before_scaling: 8         # Min weeks before first scaling
  recovery_profitable_trades: 2       # Required wins after recovery

survival_rules:
  weekly_loss_limit_pct: 0.02         # 2% weekly loss limit
  trauma_loss_threshold_pct: 0.80     # 80% of max loss
  trauma_cooldown_weeks: 2            # Weeks to block short-vol
  portfolio_risk_cap_pct: 0.04        # 4% total portfolio risk (₹20,000 on ₹5L)
  max_trades_per_week: 2              # Hard limit
  
  # Time-based blocks (IST)
  no_trade_times:
    - day: "Monday"
      start: "09:15"
      end: "10:00"
  
  no_trade_days:
    []  # Tuesday hard block disabled; expiry risk handled by strategy + hedge rules

exit_rules:
  profit_target_pct: 0.55             # 55% of max profit
  stop_loss_pct: 0.40                 # 40% of max loss
  days_before_expiry: 2               # Exit 2 days before expiry
  
  # Exit rule precedence (highest to lowest)
  precedence:
    - stop_loss
    - gamma_escalation
    - regime_flip
    - time_decay
    - profit_target

greek_safety_bands:
  delta_min: -0.2
  delta_max: 0.2
  theta_min: 0.0                      # Must be positive
  vega_min: -0.3
  vega_max: 0.1
  
  # Gamma escalation triggers
  gamma_escalation:
    spike_multiplier: 2.0             # >2x entry gamma
    combined_with:
      - negative_theta
      - regime_flip
      - equity_crisis

costs:
  brokerage_per_leg: 20               # ₹20 per leg
  exchange_charges_pct: 0.0005        # 0.05% of turnover
  sebi_charges_per_crore: 10          # ₹10 per ₹1 crore
  stamp_duty_pct: 0.00003             # 0.003% on buy side
  gst_pct: 0.18                       # 18% on brokerage + exchange

tax:
  rate: 0.30                          # India VDA 30% flat
  min_profitability_multiplier: 1.5   # Net P&L ≥ 1.5 × costs

# Macro event calendar (update quarterly)
event_calendar:
  - event_type: "RBI"
    dates:
      - "2024-02-08"
      - "2024-04-05"
      - "2024-06-07"
      - "2024-08-08"
      - "2024-10-09"
      - "2024-12-06"
    buffer_days: 2
  
  - event_type: "CPI"
    dates:
      - "2024-01-12"
      - "2024-02-12"
      - "2024-03-12"
      - "2024-04-12"
      - "2024-05-13"
      - "2024-06-12"
      - "2024-07-12"
      - "2024-08-12"
      - "2024-09-12"
      - "2024-10-14"
      - "2024-11-12"
      - "2024-12-12"
    buffer_days: 2
  
  - event_type: "WPI"
    dates:
      - "2024-01-15"
      - "2024-02-14"
      - "2024-03-14"
      - "2024-04-15"
      - "2024-05-14"
      - "2024-06-14"
      - "2024-07-15"
      - "2024-08-14"
      - "2024-09-16"
      - "2024-10-14"
      - "2024-11-14"
      - "2024-12-16"
    buffer_days: 2
  
  - event_type: "Budget"
    dates:
      - "2024-02-01"
    buffer_days: 3

lot_sizes:
  NIFTY: 65
  BANKNIFTY: 30
  FINNIFTY: 60
  MIDCPNIFTY: 120

dashboard:
  refresh_interval_seconds: 5
  greek_chart_lookback_days: 30
  trade_history_limit: 50
  
  # Alert thresholds
  alerts:
    greek_violation: true
    kill_switch_activation: true
    regime_change: true
    position_exit: true

# Logging configuration
logging:
  level: "INFO"
  file: "logs/options_trading.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
  
  # Log all decisions
  log_decisions:
    regime_detection: true
    strategy_generation: true
    eligibility_validation: true
    capital_scaling: true
    survival_rules: true
    position_management: true
    pnl_calculation: true

# Northstar V4 AlphaOS migration flags
alpha_os:
  enabled: true
  shadow_mode: false
  enforce_mode: true
  write_legacy_artifacts: true
  canonical_state_max_age_seconds: 2700
  hmm_model_path: "data/models/regime_hmm_latest.pkl"
  hmm_retrain_interval_days: 30
  hmm_min_samples: 260
  hmm_transition_smoothing: 0.02
  meta_regret_half_life_days: 20
  meta_hysteresis_relative_change: 0.10
  meta_max_weight_shift_per_cycle: 0.15
  meta_min_gross_exposure_floor: 0.25

# Data storage paths
data_paths:
  trade_ledger: "data/options/trade_ledger.parquet"
  regime_history: "data/options/regime_history.parquet"
  iv_history: "data/options/iv_history.parquet"
  position_snapshots: "data/options/position_snapshots.parquet"
