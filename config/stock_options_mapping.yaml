# Selection Criteria for Trading
# Only trade stocks that meet ALL criteria:
selection_criteria:
  min_market_cap_cr: 10000        # ₹10,000 crore minimum
  min_avg_daily_volume: 1000000   # 10 lakh shares minimum
  min_option_oi: 10000            # Minimum open interest
  max_bid_ask_spread_pct: 0.10    # 10% max spread (stricter than indices)
  min_contracts_available: 50     # Minimum option contracts

# Recommended stocks for beginners (highest liquidity)
