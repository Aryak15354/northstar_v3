# Sentiment Intelligence System Configuration
# GAP 2 Implementation for Northstar V3

sentiment_regime:
  # Regime classification parameters
  lookback_days: 252              # Window for computing baseline statistics
  smoothing_days: 5               # Smooth raw scores with 5-day EMA before classifying
  hysteresis_buffer: 0.25         # Must exceed threshold by this much to transition
  min_history_days: 60            # Need at least 60 days of history to classify
  staleness_threshold_days: 3     # If data is older than this, return UNAVAILABLE
  
  # Regime thresholds (z-score based)
  thresholds:
    panic_lower: -2.0             # z-score below this = PANIC
    fear_lower: -0.5              # z-score below this (but above panic) = FEAR
    neutral_upper: 0.5            # z-score above this = start of OPTIMISM range
    euphoria_upper: 2.0           # z-score above this = EUPHORIA
  
  # Trend classification
  trend_threshold: 0.1            # Difference between 7d and 30d EMA to classify trend

sentiment_features:
  # Feature engineering parameters
  lookback_252d: 252              # Annual lookback for z-scoring
  lookback_30d: 30                # Monthly lookback
  lookback_7d: 7                  # Weekly lookback
  
  # Feature budget allocation
  budget_category: 'alternative'  # Category for N/5 rule enforcement
  is_optional: true               # System can run without sentiment

narrative_sentiment:
  # Narrative bridge parameters
  divergence_threshold: 0.5       # Threshold for flagging sentiment-price divergence

# Signal weight modifiers by sentiment regime
# Applied in intelligence_stack.py to modulate signal weights
sentiment_signal_weights:
  PANIC:
    momentum: 0.3                 # Reduce momentum in panic
    mean_reversion: 1.5           # Increase mean reversion
    value: 1.2                    # Increase value
    quality: 1.3                  # Increase quality
  
  FEAR:
    momentum: 0.7
    mean_reversion: 1.2
    value: 1.1
    quality: 1.1
  
  NEUTRAL:
    momentum: 1.0                 # Neutral weights
    mean_reversion: 1.0
    value: 1.0
    quality: 1.0
  
  OPTIMISM:
    momentum: 1.2                 # Increase momentum
    mean_reversion: 0.9           # Reduce mean reversion
    value: 0.9                    # Reduce value
    quality: 1.0
  
  EUPHORIA:
    momentum: 1.3                 # Max momentum
    mean_reversion: 0.7           # Min mean reversion
    value: 0.6                    # Min value (cheap stays cheap in euphoria)
    quality: 1.1
  
  UNAVAILABLE:
    momentum: 1.0                 # Neutral fallback
    mean_reversion: 1.0
    value: 1.0
    quality: 1.0

# Confidence engine weights
sentiment_confidence_weight: 0.15  # Weight of sentiment in overall confidence score
