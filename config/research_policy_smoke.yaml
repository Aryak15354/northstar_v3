freeze_active: false
freeze_start_ist: "2026-02-17"
freeze_days: 60

modules_enabled:
  strategy_lab: true
  regime_lab: true
  covariance_lab: false
  monte_carlo_lab: false
  parameter_optimizer: false

output_restrictions:
  mark_non_actionable_during_freeze: true
  require_manual_promotion: true
  block_auto_parameter_deployment: true
  require_operator_approval: true

historical_research:
  enabled: true
  random_state: 42
  enable_deep_models: false
  enable_hyperopt: false
  candidate_acceptance_threshold: 0.55
  min_ensemble_models: 2

  dataset:
    prices_path: "data/processed/prices.parquet"
    fundamentals_path: "data/processed/fundamentals.parquet"
    valuation_posterior_path: "data/processed/valuation_posterior.parquet"
    live_returns_cutover_date: "2026-01-18"
    target_col: "forward_return_5d"
    target_horizon_days: 5
    use_et500_features: false
    use_et500_universe_filter: false
    et500_membership_path: "data/reference/et500_pit_membership.csv"
    use_screener_features: false
    screener_fundamentals_path: "data/processed/screener_fundamentals_annual.csv"
    screener_shareholding_path: "data/processed/screener_shareholding.csv"
    use_alternative_features: false
    alternative_data_path: "data/processed/alternative/"
    alternative_features_available:
      bulk_deals: true
      promoter_pledge: true
      earnings_dates: true
      credit_ratings: true
      order_announcements: false
    use_sentiment_features: false
    use_sentiment_regime: false
    sentiment_path: "data/canonical/sentiment/company_sentiment_daily.parquet"
    market_sentiment_path: "data/canonical/sentiment/market_sentiment_daily.parquet"
    sentiment_duckdb_path: "data/sentiment.duckdb"
    use_macro_features: false
    lookback_days: 900
    max_tickers: 30
    max_rows: 15000

  training:
    train_periods: 168
    valid_periods: 21
    test_periods: 21
    step_periods: 21
    max_windows: 1

  enabled_models:
    - random_forest
  model_params:
    random_forest:
      n_estimators: 120
      max_depth: 8
      min_samples_leaf: 3
      n_jobs: 1

  n_macro_factors: 3
  mc_paths: 800
  mc_horizon: 10
  mc_fit_rows: 12000
  mc_stress_multiplier: 1.0
  weekend_mc_paths: 1200
  weekend_mc_horizon: 14
  weekend_scenario_multipliers: [0.9, 1.0, 1.2]
  mutation_rate: 0.25
  options_opportunity_max_rows: 30
  live_returns_cutover_date: "2026-01-18"

  weekend_only_tasks:
    extended_scenario_sweep: true

  experiment_path: "data/results/research/trackers/experiments.ndjson"
  memory_path: "data/results/research/state/research_memory.json"
