# Northstar V3 Comprehensive Operation System Configuration

# System Settings
system:
  max_concurrent_operations: 3
  operation_timeout_hours: 24
  data_retention_days: 365
  enable_real_time_monitoring: true

# Performance Thresholds
performance_thresholds:
  min_sharpe_ratio: 0.5
  max_drawdown_threshold: 0.15
  min_information_ratio: 0.3
  max_var_breaches: 5
  min_hit_rate: 0.52
  min_signal_quality: 0.6
  max_latency_ms: 100.0
  min_data_quality: 0.95

# Crisis Periods for Testing
crisis_periods:
  - name: "2008_financial_crisis"
    start_date: "2007-10-01"
    end_date: "2009-03-31"
    severity: "extreme"
    characteristics: ["credit_crunch", "liquidity_crisis", "volatility_spike"]
    description: "Global financial crisis triggered by subprime mortgage collapse"
  
  - name: "2020_covid_crash"
    start_date: "2020-02-01"
    end_date: "2020-05-31"
    severity: "extreme"
    characteristics: ["pandemic_shock", "circuit_breakers", "policy_response"]
    description: "COVID-19 pandemic market crash and recovery"
  
  - name: "2000_dotcom_bubble"
    start_date: "2000-03-01"
    end_date: "2002-10-31"
    severity: "high"
    characteristics: ["tech_bubble", "valuation_reset", "recession"]
    description: "Dot-com bubble burst and subsequent recession"

# Validation Scenarios
validation_scenarios:
  - name: "comprehensive_system_test"
    scenario_type: "full_system"
    timeout_minutes: 120
    parameters:
      include_crisis_testing: true
      include_alpha_validation: true
      include_stress_testing: true
  
  - name: "crisis_only_test"
    scenario_type: "crisis_validation"
    timeout_minutes: 60
    parameters:
      crisis_periods: ["2008_financial_crisis", "2020_covid_crash"]
  
  - name: "alpha_only_test"
    scenario_type: "alpha_validation"
    timeout_minutes: 45
    parameters:
      regimes: ["bull", "bear", "sideways"]

# Alert Configuration
alerts:
  email_recipients:
    - "operations@northstar.com"
    - "risk@northstar.com"
  
  slack_webhook: null  # Set to Slack webhook URL if available
  
  alert_thresholds:
    critical_drawdown: 0.20
    critical_var_breaches: 10
    critical_latency_ms: 500
    critical_data_quality: 0.80
  
  escalation_rules:
    critical_alert_delay_minutes: 5
    emergency_alert_delay_minutes: 1

# Reporting Configuration
reporting:
  output_directory: "reports/operation"
  report_formats: ["html", "json", "pdf"]
  include_charts: true
  chart_style: "professional"
  auto_email: false
  email_recipients:
    - "management@northstar.com"
    - "investors@northstar.com"

# Backtesting Configuration
backtesting:
  default_initial_capital: 1000000.0
  default_rebalance_frequency: "weekly"
  default_benchmark: "NIFTY50"
  transaction_cost_bps: 10.0
  market_impact_model: "linear"
  max_position_size: 0.05
  max_sector_exposure: 0.20
  var_confidence: 0.95

# Walk-Forward Analysis Configuration
walk_forward:
  training_window_months: 24
  testing_window_months: 6
  step_size_months: 3
  optimization_metric: "sharpe_ratio"
  reoptimization_frequency: "quarterly"
  minimum_observations: 252
  max_iterations: 100
  convergence_tolerance: 0.000001

# Logging Configuration
logging:
  log_level: "INFO"
  log_directory: "logs/operation"
  max_log_size_mb: 10
  backup_count: 5
  enable_performance_logging: true
  enable_alert_logging: true