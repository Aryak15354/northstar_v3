# Northstar V3 — Research / live-scoring policy anchor.
#
# This file was reconstructed 2026-07 after the audit found it had been deleted
# (~2026-06-02, leaving only a one-line comment) while 30+ modules and the live
# scorer still referenced it via `--config config/research_policy.yaml` and
# src/data/loaders.py DEFAULT_POLICY_PATH. A missing file made _load_config /
# _load_policy silently return {}, so the whole system ran on hard-coded code
# defaults with no indication the policy was absent.
#
# The values below are the EXPLICIT, version-controlled statement of the knobs
# that were previously the implicit code defaults — so restoring this file
# changes NO behavior, it only makes the policy visible and auditable. Missing
# or unreadable config is now logged loudly (see generate_daily_scorer_scores
# and src/data/loaders) rather than swallowed.
#
# NOTE: dataset paths are intentionally NOT pinned here. Price/fundamental/macro/
# sentiment artifacts are resolved through the canonical artifact contracts
# (src/data/artifact_contracts.py) and the loaders' canonical-first defaults;
# pinning a path here would silently override that resolution. Add a
# `historical_research.dataset` block only to deliberately pin a frozen research
# snapshot.

version: 1

# ---- Live portfolio construction (DailyScorer) ----
# These match src/scoring/daily_scorer.py defaults exactly.
portfolio_mandate: long_only        # long_only | long_short
portfolio_top_n: 20                 # concentrated book size (turnover-constrained)
max_weekly_turnover: 0.30           # max fraction of the book replaced per week

# ---- Cross-sectional prediction transform ----
# Regime models are trained for cross-sectional ranking; standardize each
# inference cross-section before overlays/allocator. Matches
# DailyScorer._prediction_transform_settings defaults.
target_type: cross_sectional_rank
prediction_transform: zscore        # raw | zscore | rank | rank_power | tanh
prediction_rank_power: 1.5
prediction_tanh_scale: 3.0
