# Aggressive Configuration
# Higher limits, more leverage - for experienced operators

# Position Limits
position_limits:
  per_underlying: 200
  total: 1000
  max_concentration: 0.30  # 30% max per underlying

# Greeks Limits
greeks_limits:
  delta: 2000
  gamma: 1000
  vega: 20000
  theta: -1000
  rho: 10000

# Risk Thresholds
risk_thresholds:
  var_95: 100000  # $100k max VaR at 95%
  var_99: 200000  # $200k max VaR at 99%
  cvar_95: 150000  # $150k max CVaR at 95%
  max_drawdown: 0.20  # 20% max drawdown

# Regime-Conditional Adjustments
regime_adjustments:
  crisis:
    position_limits_multiplier: 0.5
    short_vol_allowed: false
    max_leverage: 1.5
  high_vol:
    position_limits_multiplier: 0.75
    short_vol_allowed: true
    max_leverage: 2.0
  low_vol:
    position_limits_multiplier: 1.0
    short_vol_allowed: true
    max_leverage: 2.5

# Execution Parameters
execution:
  default_order_type: "LIMIT"
  limit_price_offset: 0.02  # 2 cents better than mid (aggressive)
  time_in_force: "DAY"
  preferred_venues: ["CBOE", "ISE", "PHLX", "AMEX"]
  min_liquidity: 500  # contracts (lower requirement)

# Performance Monitoring
monitoring:
  pnl_update_frequency: 60  # seconds
  greeks_update_frequency: 30  # seconds
  risk_check_frequency: 300  # seconds
  performance_degradation_threshold: 0.4  # 40% Sharpe decline

# State Persistence
persistence:
  snapshot_frequency: 300  # seconds (5 minutes)
  snapshot_directory: "snapshots/"
  max_snapshots: 100

# Monte Carlo
monte_carlo_workers: 8  # More workers for faster simulation

# Margin
margin_buffer: 1.2  # 1.2x margin buffer (tighter)

# Concentration Limits
concentration_limits:
  max_pct_per_underlying: 0.30
  max_pct_per_strategy: 0.40
  max_pct_per_expiry: 0.35
