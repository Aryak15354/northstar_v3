[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    tests
    src
python_files =
    test_*.py
    *_test.py
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    .pytest_cache
    _cold_archive
    archive
    backups
    tmp
    data
    logs
    dist
    build
    catboost_info
filterwarnings =
    ignore::DeprecationWarning
