[pytest]
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    .hypothesis
    node_modules
    archive
    _cold_archive
    backups
    data
    dashboard
    logs
    legacy
    northstar
    reports
    snapshots
    system
    analysis_results
    truth_mode_runs
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -ra
