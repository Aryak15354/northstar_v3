name: CI

# Runs the static quality gates and the test suite on every push and PR.
# Previously the gates in scripts/ci/ existed but nothing invoked them
# automatically -- they were manual-only, so a regression could land silently.
# This workflow makes `make ci` (static gates + pytest) actually enforce.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static quality gates
        run: make gates

      - name: Test suite
        run: make test
